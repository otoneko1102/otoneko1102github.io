<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const newDomain = "https://otnc.github.io";
    
    const path = window.location.pathname;
    const query = window.location.search;
    const hash = window.location.hash;
    
    const newUrl = newDomain + path + query + hash;
    window.location.replace(newUrl);
  </script>
</head>
<body>
  <p>新しいサイトへ移動しています。自動的に切り替わらない場合は、<a id="redirect-link" href="https://otnc.github.io">こちら</a>をクリックしてください。</p>
  <script>
    document.getElementById('redirect-link').href = newUrl;
  </script>
</body>
</html>
